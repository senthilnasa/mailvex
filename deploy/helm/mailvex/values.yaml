global:
  environment: production
  profile: cluster

api:
  replicaCount: 3
  image:
    repository: mailvex/mailvex-api
    tag: 1.0.0
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 256Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80

worker:
  replicaCount: 4
  image:
    repository: mailvex/mailvex-worker
    tag: 1.0.0
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 2000m
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 512Mi

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: mailvex.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: mailvex-tls
      hosts:
        - mailvex.example.com

env:
  MVX_PROFILE: cluster
  MVX_DATABASE_URL: "" # Injected from Secret
  MVX_REDIS_URL: ""    # Injected from Secret
  MVX_KEK: ""          # Injected from Secret
