services:
  mariadb:
    image: mariadb:11.4
    container_name: mailvex-dev-mariadb
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: mailvex
      MYSQL_USER: mailvex
      MYSQL_PASSWORD: mailvex_secret
    ports:
      - "3306:3306"

  redis:
    image: redis:7-alpine
    container_name: mailvex-dev-redis
    ports:
      - "6379:6379"
