services:
  api:
    image: mailvex/mailvex-api:latest
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.api
    container_name: mailvex-api
    restart: always
    ports:
      - "${MVX_APP_PORT:-8080}:8080"
    env_file:
      - path: ../../.env
        required: false
    environment:
      - MVX_PROFILE=${MVX_PROFILE:-standard}
      - MVX_APP_ENV=${MVX_APP_ENV:-development}
      - MVX_DATABASE_URL=${MVX_DATABASE_URL:-mailvex:${MYSQL_PASSWORD:-secret}@tcp(mariadb:3306)/mailvex?parseTime=true}
      - MVX_REDIS_URL=${MVX_REDIS_URL:-redis:6379}
      - MVX_MASTER_KEY=${MVX_MASTER_KEY:-}
      - MVX_KEK=${MVX_KEK:-}
      - MVX_KEK_PROVIDER=${MVX_KEK_PROVIDER:-env}
      - MVX_DATA_DIR=${MVX_DATA_DIR:-/var/lib/mailvex}
    volumes:
      - mailvex_data:/var/lib/mailvex
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    image: mailvex/mailvex-worker:latest
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.worker
    container_name: mailvex-worker
    restart: always
    env_file:
      - path: ../../.env
        required: false
    environment:
      - MVX_PROFILE=${MVX_PROFILE:-standard}
      - MVX_APP_ENV=${MVX_APP_ENV:-development}
      - MVX_DATABASE_URL=${MVX_DATABASE_URL:-mailvex:${MYSQL_PASSWORD:-secret}@tcp(mariadb:3306)/mailvex?parseTime=true}
      - MVX_REDIS_URL=${MVX_REDIS_URL:-redis:6379}
      - MVX_MASTER_KEY=${MVX_MASTER_KEY:-}
      - MVX_KEK=${MVX_KEK:-}
      - MVX_KEK_PROVIDER=${MVX_KEK_PROVIDER:-env}
      - MVX_OUTBOUND_PORT=${MVX_OUTBOUND_PORT:-25}
      - MVX_DATA_DIR=${MVX_DATA_DIR:-/var/lib/mailvex}
    volumes:
      - mailvex_data:/var/lib/mailvex
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy

  mariadb:
    image: mariadb:11.4
    container_name: mailvex-standard-db
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-rootsecret}
      - MYSQL_DATABASE=${MVX_DB_NAME:-mailvex}
      - MYSQL_USER=${MVX_DB_USER:-mailvex}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-secret}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: mailvex-standard-redis
    restart: always
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  db_data:
  redis_data:
  mailvex_data:
