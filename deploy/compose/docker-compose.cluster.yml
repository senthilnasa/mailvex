services:
  haproxy:
    image: haproxy:2.8-alpine
    container_name: mailvex-haproxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "25:25"
      - "8404:8404" # Stats
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - api-1
      - api-2

  api-1:
    image: mailvex/mailvex-api:latest
    restart: always
    environment:
      - MVX_PROFILE=cluster
      - MVX_NODE_ID=api-node-1
      - MVX_DATABASE_URL=mailvex:secret@tcp(mariadb:3306)/mailvex?parseTime=true
      - MVX_REDIS_URL=redis:6379

  api-2:
    image: mailvex/mailvex-api:latest
    restart: always
    environment:
      - MVX_PROFILE=cluster
      - MVX_NODE_ID=api-node-2
      - MVX_DATABASE_URL=mailvex:secret@tcp(mariadb:3306)/mailvex?parseTime=true
      - MVX_REDIS_URL=redis:6379

  worker-1:
    image: mailvex/mailvex-worker:latest
    restart: always
    environment:
      - MVX_PROFILE=cluster
      - MVX_NODE_ID=worker-node-1
      - MVX_DATABASE_URL=mailvex:secret@tcp(mariadb:3306)/mailvex?parseTime=true
      - MVX_REDIS_URL=redis:6379

  worker-2:
    image: mailvex/mailvex-worker:latest
    restart: always
    environment:
      - MVX_PROFILE=cluster
      - MVX_NODE_ID=worker-node-2
      - MVX_DATABASE_URL=mailvex:secret@tcp(mariadb:3306)/mailvex?parseTime=true
      - MVX_REDIS_URL=redis:6379

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: mailvex-prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.0.0
    container_name: mailvex-grafana
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ../grafana/mailvex_dashboard.json:/etc/grafana/provisioning/dashboards/mailvex.json:ro
