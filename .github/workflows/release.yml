name: Release & Container Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    name: Build & Push Multi-Arch Images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: mailvex-allinone
            dockerfile: deploy/docker/Dockerfile.allinone
            context: .
          - name: mailvex-api
            dockerfile: deploy/docker/Dockerfile.api
            context: .
          - name: mailvex-worker
            dockerfile: deploy/docker/Dockerfile.worker
            context: .

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: 'linux/amd64,linux/arm64'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: Build and push multi-arch Docker image
        id: build-push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate Syft SPDX SBOM
        uses: anchore/sbom-action@v0.16.0
        with:
          image: ${{ steps.meta.outputs.tags }}
          format: spdx-json
          output-file: ${{ matrix.name }}-sbom.spdx.json

      - name: Attach SBOM to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.name }}-sbom.spdx.json

      - name: Sign Container Images with Cosign (Keyless)
        run: |
          cosign sign --yes "${{ steps.meta.outputs.tags }}"
