openapi: 3.1.0
info:
  title: Mailvex API
  version: 1.0.0
  description: Multi-tenant, self-hosted email infrastructure platform API.
servers:
  - url: /v1
    description: Current server v1 API
paths:
  /health:
    get:
      summary: Liveness probe
      responses:
        '200':
          description: Service is alive
  /ready:
    get:
      summary: Readiness probe
      responses:
        '200':
          description: Dependencies (DB, Redis, etc.) are healthy
        '503':
          description: One or more dependencies are unhealthy

  /auth/login:
    post:
      summary: Console user login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Login successful, session cookie set
        '401':
          description: Invalid credentials

  /auth/logout:
    post:
      summary: Console user logout
      responses:
        '200':
          description: Logged out successfully

  /auth/me:
    get:
      summary: Current authenticated user details and active tenant
      responses:
        '200':
          description: User profile and permissions

  /setup:
    get:
      summary: Get setup wizard status
      responses:
        '200':
          description: Setup status
    post:
      summary: Execute initial installation setup step
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Step completed successfully

  /organizations:
    get:
      summary: List organizations
      responses:
        '200':
          description: List of organizations
    post:
      summary: Create organization
      responses:
        '201':
          description: Organization created

  /tenants:
    get:
      summary: List tenants accessible to user
      responses:
        '200':
          description: List of tenants
    post:
      summary: Create tenant
      responses:
        '201':
          description: Tenant created

  /email:
    post:
      summary: Send email via REST API
      parameters:
        - in: header
          name: Idempotency-Key
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to, subject]
              properties:
                from: { type: string }
                to: { type: array, items: { type: string } }
                cc: { type: array, items: { type: string } }
                bcc: { type: array, items: { type: string } }
                reply_to: { type: string }
                subject: { type: string }
                text: { type: string }
                html: { type: string }
                headers: { type: object, additionalProperties: { type: string } }
                tags: { type: array, items: { type: string } }
                metadata: { type: object, additionalProperties: { type: string } }
                template_id: { type: string }
                template_variables: { type: object }
                stream: { type: string, default: transactional }
      responses:
        '202':
          description: Email accepted and queued
        '400':
          description: Invalid request, unverified domain, or header injection detected
        '409':
          description: Idempotency key conflict

  /email/batch:
    post:
      summary: Send batch emails (up to 500 recipients)
      parameters:
        - in: header
          name: Idempotency-Key
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, recipients]
              properties:
                from: { type: string }
                subject: { type: string }
                text: { type: string }
                html: { type: string }
                stream: { type: string }
                recipients:
                  type: array
                  items:
                    type: object
                    required: [to]
                    properties:
                      to: { type: string }
                      template_variables: { type: object }
                      metadata: { type: object }
      responses:
        '200':
          description: Batch processed with per-recipient status
        '400':
          description: Validation error or limit exceeded

  /messages:
    get:
      summary: List messages (cursor-based pagination)
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 50 }
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: recipient
          schema: { type: string }
        - in: query
          name: from
          schema: { type: string }
        - in: query
          name: stream
          schema: { type: string }
      responses:
        '200':
          description: Paginated messages list with cursor

  /messages/{id}:
    get:
      summary: Get message details
      responses:
        '200':
          description: Message details and recipient overview

  /messages/{id}/recipients:
    get:
      summary: List message recipients
      responses:
        '200':
          description: Message recipients list

  /messages/{id}/events:
    get:
      summary: List chronological event history for message
      responses:
        '200':
          description: Message events list

  /messages/{id}/body:
    get:
      summary: Retrieve stored message body
      responses:
        '200':
          description: HTML and text content

  /messages/{id}/retry:
    post:
      summary: Retry delivery of message
      responses:
        '200':
          description: Message marked for retry

  /messages/{id}/cancel:
    post:
      summary: Cancel queued message
      responses:
        '200':
          description: Message cancelled

  /templates:
    get:
      summary: List templates
      responses:
        '200':
          description: Templates list
    post:
      summary: Create new template
      responses:
        '201':
          description: Template created

  /templates/{id}:
    get:
      summary: Get template details
      responses:
        '200':
          description: Template details and published version

  /templates/{id}/render:
    post:
      summary: Preview template rendering with variables
      responses:
        '200':
          description: Rendered subject, HTML, and text

  /domains:
    get:
      summary: List domains for tenant
      responses:
        '200':
          description: List of domains
    post:
      summary: Add domain
      responses:
        '201':
          description: Domain added

  /domains/{id}/verify:
    post:
      summary: Trigger DNS verification for domain
      responses:
        '200':
          description: Verification results

  /api-keys:
    get:
      summary: List API keys
      responses:
        '200':
          description: List of keys
    post:
      summary: Create API key
      responses:
        '201':
          description: API key created with secret token displayed once

  /api-keys/{id}:
    delete:
      summary: Revoke API key immediately
      responses:
        '200':
          description: API key revoked

  /smtp-credentials:
    get:
      summary: List SMTP credentials
      responses:
        '200':
          description: Credentials list
    post:
      summary: Create SMTP credential
      responses:
        '201':
          description: Credential created with password displayed once

  /webhooks:
    get:
      summary: List webhooks
      responses:
        '200':
          description: Webhooks list
    post:
      summary: Create webhook endpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, format: uri }
                description: { type: string }
                events:
                  type: array
                  items: { type: string }
      responses:
        '201':
          description: Webhook created

  /webhooks/{id}:
    get:
      summary: Get webhook endpoint details
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Webhook details
    patch:
      summary: Update webhook endpoint
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                url: { type: string, format: uri }
                description: { type: string }
                events:
                  type: array
                  items: { type: string }
                status:
                  type: string
                  enum: [active, disabled_manual]
      responses:
        '200':
          description: Webhook updated
    delete:
      summary: Delete webhook endpoint
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Webhook deleted

  /webhooks/{id}/rotate-secret:
    post:
      summary: Rotate webhook signing secret with 24-hour overlap window
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Secret rotated and expiration scheduled

  /webhooks/{id}/test:
    post:
      summary: Send a test ping event to webhook endpoint
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Test ping dispatch result

  /webhooks/{id}/deliveries:
    get:
      summary: List webhook delivery attempts
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: Webhook deliveries history

  /suppressions:
    get:
      summary: List suppressed addresses
      responses:
        '200':
          description: Suppressions list
    post:
      summary: Add suppression
      responses:
        '201':
          description: Address suppressed

  /suppressions/{id}:
    delete:
      summary: Delete suppression
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Suppression removed

  /suppressions/import:
    post:
      summary: Bulk import suppressions via CSV or JSON
      responses:
        '200':
          description: Suppression import summary

  /suppressions/export:
    get:
      summary: Export active suppressions as CSV or JSON
      parameters:
        - name: stream_id
          in: query
          required: false
          schema:
            type: string
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [csv, json]
      responses:
        '200':
          description: Exported suppressions stream

  /privacy/erasure:
    post:
      summary: Execute GDPR Article 17 / DPDP Right-to-be-Forgotten personal data erasure
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
      responses:
        '200':
          description: Privacy erasure record

  /privacy/export:
    post:
      summary: Generate GDPR Article 15 personal data portability export
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
      responses:
        '200':
          description: Personal data export report

  /privacy/requests:
    get:
      summary: List logged privacy requests
      responses:
        '200':
          description: Privacy requests list

  /retention:
    get:
      summary: Retrieve data retention policy
      responses:
        '200':
          description: Retention policy
    put:
      summary: Update data retention policy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message_retention_days:
                  type: integer
                events_retention_days:
                  type: integer
                attempts_retention_days:
                  type: integer
                raw_mime_retention_days:
                  type: integer
      responses:
        '200':
          description: Updated retention policy

  /retention/purge:
    post:
      summary: Trigger immediate retention purge for tenant
      responses:
        '200':
          description: Retention purge summary

  /u/{token}:
    get:
      summary: Hosted unsubscribe confirmation page
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: HTML unsubscribe page
    post:
      summary: RFC 8058 One-Click unsubscribe endpoint
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Unsubscribed successfully

  /audit-logs:
    get:
      summary: List audit log entries
      responses:
        '200':
          description: Audit logs

  /v1/abuse-reports:
    get:
      summary: List abuse and postmaster intake reports
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, resolved, escalated]
      responses:
        '200':
          description: List of abuse reports

  /v1/abuse-reports/{id}/resolve:
    post:
      summary: Resolve an abuse report
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                notes:
                  type: string
      responses:
        '200':
          description: Resolved abuse report

  /v1/abuse-reports/{id}/escalate:
    post:
      summary: Escalate an abuse report
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                notes:
                  type: string
      responses:
        '200':
          description: Escalated abuse report

  /v1/reports/dsn:
    post:
      summary: Ingest DSN bounce notification (RFC 3464)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                raw_mime:
                  type: string
                envelope_recipient:
                  type: string
      responses:
        '200':
          description: DSN processing outcome

  /v1/reports/arf:
    post:
      summary: Ingest ARF feedback loop complaint (RFC 5965)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                raw_mime:
                  type: string
      responses:
        '200':
          description: ARF complaint processing outcome

  /v1/reports/fbl:
    get:
      summary: List FBL complaint records
      responses:
        '200':
          description: FBL reports list

  /v1/reports/postmaster:
    get:
      summary: List Google Postmaster / SNDS snapshots
      parameters:
        - name: domain_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Snapshots list
    post:
      summary: Record provider reputation snapshot
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                domain_id:
                  type: string
                spam_rate:
                  type: number
                domain_reputation:
                  type: string
      responses:
        '201':
          description: Snapshot recorded

  /v1/analytics/overview:
    get:
      summary: Query aggregated deliverability KPIs and complaint rate warning
      parameters:
        - name: range
          in: query
          schema:
            type: string
            enum: [24h, 7d, 30d]
            default: 24h
        - name: stream_id
          in: query
          schema:
            type: string
        - name: domain_id
          in: query
          schema:
            type: string
        - name: provider
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Analytics overview summary

  /v1/analytics/time-series:
    get:
      summary: Query time-series delivery and bounce trend points
      parameters:
        - name: range
          in: query
          schema:
            type: string
            enum: [24h, 7d, 30d]
        - name: resolution
          in: query
          schema:
            type: string
            enum: [1h, 1d]
      responses:
        '200':
          description: Time series points

  /v1/analytics/providers:
    get:
      summary: Query delivery and complaint breakdown classified by major mailbox provider
      parameters:
        - name: range
          in: query
          schema:
            type: string
            enum: [24h, 7d, 30d]
      responses:
        '200':
          description: Major provider breakdown

  /v1/analytics/latency:
    get:
      summary: Query outbound SMTP delivery latency histogram distribution
      parameters:
        - name: range
          in: query
          schema:
            type: string
            enum: [24h, 7d, 30d]
      responses:
        '200':
          description: Latency histogram distribution

  /v1/analytics/export:
    post:
      summary: Trigger asynchronous or on-demand analytics CSV export
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                range:
                  type: string
                  enum: [24h, 7d, 30d]
                stream_id:
                  type: string
                domain_id:
                  type: string
      responses:
        '201':
          description: Export job created

  /v1/analytics/exports:
    get:
      summary: List analytics report exports
      responses:
        '200':
          description: Export jobs list

  /v1/analytics/exports/{id}/download:
    get:
      summary: Download generated analytics CSV report
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: CSV file download
          content:
            text/csv:
              schema:
                type: string

  /o/{token}:
    get:
      summary: Transparent 1x1 GIF open tracking pixel
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
          description: Signed HMAC tracking token
      responses:
        '200':
          description: RFC 2046 transparent 1x1 GIF with Cache-Control no-store
          content:
            image/gif:
              schema:
                type: string
                format: binary
        '404':
          description: Token invalid, expired, or tampered

  /c/{token}:
    get:
      summary: Safe click tracking redirect
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
          description: Signed HMAC tracking token
      responses:
        '302':
          description: Temporary redirect to safe repository-resolved destination URL
        '404':
          description: Link not found or token invalid

  /v1/inbound/routes:
    get:
      summary: List inbound mail routing rules
      responses:
        '200':
          description: Array of inbound routing rules sorted by priority
    post:
      summary: Create inbound mail routing rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pattern]
              properties:
                priority: { type: integer, default: 10 }
                match_type: { type: string, enum: [exact, wildcard, catch_all], default: exact }
                pattern: { type: string }
                action: { type: string, enum: [webhook, store_only, forward, discard], default: webhook }
                action_target: { type: string }
                is_active: { type: boolean, default: true }
      responses:
        '201':
          description: Inbound route created

  /v1/inbound/routes/{id}:
    get:
      summary: Get inbound routing rule by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Inbound route details
        '404':
          description: Route not found
    patch:
      summary: Update inbound routing rule
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                priority: { type: integer }
                match_type: { type: string, enum: [exact, wildcard, catch_all] }
                pattern: { type: string }
                action: { type: string, enum: [webhook, store_only, forward, discard] }
                action_target: { type: string }
                is_active: { type: boolean }
      responses:
        '200':
          description: Updated inbound route
        '404':
          description: Route not found
    delete:
      summary: Delete inbound routing rule
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Inbound route deleted
        '404':
          description: Route not found

  /v1/inbound/routes/test:
    post:
      summary: Test inbound recipient address against active routing table
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address]
              properties:
                address: { type: string, format: email }
      responses:
        '200':
          description: Route match result with matched flag and rule details

  /v1/inbound/messages:
    get:
      summary: List received inbound emails
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        '200':
          description: Array of inbound messages with SPF/DKIM/DMARC verdicts

  /v1/inbound/messages/{id}:
    get:
      summary: Get inbound message details
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Inbound message detail
        '404':
          description: Inbound message not found
