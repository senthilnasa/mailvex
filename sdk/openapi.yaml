openapi: 3.1.0
info:
  title: Mailvex API
  version: 1.0.0
  description: Multi-tenant, self-hosted email infrastructure platform API.
servers:
  - url: /v1
    description: Current server v1 API
paths:
  /health:
    get:
      summary: Liveness probe
      responses:
        '200':
          description: Service is alive
  /ready:
    get:
      summary: Readiness probe
      responses:
        '200':
          description: Dependencies (DB, Redis, etc.) are healthy
        '503':
          description: One or more dependencies are unhealthy

  /auth/login:
    post:
      summary: Console user login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: Login successful, session cookie set
        '401':
          description: Invalid credentials

  /auth/logout:
    post:
      summary: Console user logout
      responses:
        '200':
          description: Logged out successfully

  /auth/me:
    get:
      summary: Current authenticated user details and active tenant
      responses:
        '200':
          description: User profile and permissions

  /setup:
    get:
      summary: Get setup wizard status
      responses:
        '200':
          description: Setup status
    post:
      summary: Execute initial installation setup step
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Step completed successfully

  /organizations:
    get:
      summary: List organizations
      responses:
        '200':
          description: List of organizations
    post:
      summary: Create organization
      responses:
        '201':
          description: Organization created

  /tenants:
    get:
      summary: List tenants accessible to user
      responses:
        '200':
          description: List of tenants
    post:
      summary: Create tenant
      responses:
        '201':
          description: Tenant created

  /email:
    post:
      summary: Send email via REST API
      parameters:
        - in: header
          name: Idempotency-Key
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to, subject]
              properties:
                from: { type: string }
                to: { type: array, items: { type: string } }
                cc: { type: array, items: { type: string } }
                bcc: { type: array, items: { type: string } }
                reply_to: { type: string }
                subject: { type: string }
                text: { type: string }
                html: { type: string }
                headers: { type: object, additionalProperties: { type: string } }
                tags: { type: array, items: { type: string } }
                metadata: { type: object, additionalProperties: { type: string } }
                template_id: { type: string }
                template_variables: { type: object }
                stream: { type: string, default: transactional }
      responses:
        '202':
          description: Email accepted and queued
        '400':
          description: Invalid request, unverified domain, or header injection detected
        '409':
          description: Idempotency key conflict

  /email/batch:
    post:
      summary: Send batch emails (up to 500 recipients)
      parameters:
        - in: header
          name: Idempotency-Key
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, recipients]
              properties:
                from: { type: string }
                subject: { type: string }
                text: { type: string }
                html: { type: string }
                stream: { type: string }
                recipients:
                  type: array
                  items:
                    type: object
                    required: [to]
                    properties:
                      to: { type: string }
                      template_variables: { type: object }
                      metadata: { type: object }
      responses:
        '200':
          description: Batch processed with per-recipient status
        '400':
          description: Validation error or limit exceeded

  /messages:
    get:
      summary: List messages (cursor-based pagination)
      parameters:
        - in: query
          name: limit
          schema: { type: integer, default: 50 }
        - in: query
          name: cursor
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string }
        - in: query
          name: recipient
          schema: { type: string }
        - in: query
          name: from
          schema: { type: string }
        - in: query
          name: stream
          schema: { type: string }
      responses:
        '200':
          description: Paginated messages list with cursor

  /messages/{id}:
    get:
      summary: Get message details
      responses:
        '200':
          description: Message details and recipient overview

  /messages/{id}/recipients:
    get:
      summary: List message recipients
      responses:
        '200':
          description: Message recipients list

  /messages/{id}/events:
    get:
      summary: List chronological event history for message
      responses:
        '200':
          description: Message events list

  /messages/{id}/body:
    get:
      summary: Retrieve stored message body
      responses:
        '200':
          description: HTML and text content

  /messages/{id}/retry:
    post:
      summary: Retry delivery of message
      responses:
        '200':
          description: Message marked for retry

  /messages/{id}/cancel:
    post:
      summary: Cancel queued message
      responses:
        '200':
          description: Message cancelled

  /templates:
    get:
      summary: List templates
      responses:
        '200':
          description: Templates list
    post:
      summary: Create new template
      responses:
        '201':
          description: Template created

  /templates/{id}:
    get:
      summary: Get template details
      responses:
        '200':
          description: Template details and published version

  /templates/{id}/render:
    post:
      summary: Preview template rendering with variables
      responses:
        '200':
          description: Rendered subject, HTML, and text

  /domains:
    get:
      summary: List domains for tenant
      responses:
        '200':
          description: List of domains
    post:
      summary: Add domain
      responses:
        '201':
          description: Domain added

  /domains/{id}/verify:
    post:
      summary: Trigger DNS verification for domain
      responses:
        '200':
          description: Verification results

  /api-keys:
    get:
      summary: List API keys
      responses:
        '200':
          description: List of keys
    post:
      summary: Create API key
      responses:
        '201':
          description: API key created with secret token displayed once

  /api-keys/{id}:
    delete:
      summary: Revoke API key immediately
      responses:
        '200':
          description: API key revoked

  /smtp-credentials:
    get:
      summary: List SMTP credentials
      responses:
        '200':
          description: Credentials list
    post:
      summary: Create SMTP credential
      responses:
        '201':
          description: Credential created with password displayed once

  /webhooks:
    get:
      summary: List webhooks
      responses:
        '200':
          description: Webhooks list
    post:
      summary: Create webhook endpoint
      responses:
        '201':
          description: Webhook created

  /suppressions:
    get:
      summary: List suppressed addresses
      responses:
        '200':
          description: Suppressions list
    post:
      summary: Add suppression
      responses:
        '201':
          description: Address suppressed

  /suppressions/{id}:
    delete:
      summary: Delete suppression
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Suppression removed

  /u/{token}:
    get:
      summary: Hosted unsubscribe confirmation page
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: HTML unsubscribe page
    post:
      summary: RFC 8058 One-Click unsubscribe endpoint
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Unsubscribed successfully

  /audit-logs:
    get:
      summary: List audit log entries
      responses:
        '200':
          description: Audit logs
